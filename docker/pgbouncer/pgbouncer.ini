[databases]
neondb = host=postgres port=5432 dbname=neondb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; The mode Neon's pooled connection uses.
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Prepared statements survive transaction pooling since PgBouncer 1.21, as on Neon.
max_prepared_statements = 100
ignore_startup_parameters = extra_float_digits,options
