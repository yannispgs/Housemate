# Local database for development, shaped like Neon (see docker/postgres).
#
# Both ports listen on 127.0.0.1 only — this machine is reachable from the
# internet — which is what allows local connections without any password.
# There is no credential in this repository.
#
#   pooled (as the app connects on Neon)  postgres://neondb_owner@127.0.0.1:56432/neondb
#   direct (migrations)                   postgres://neondb_owner@127.0.0.1:55432/neondb
name: housemate

services:
  postgres:
    # Named, so that CI can build it with a cache (docker/bake-action) and
    # compose then starts exactly that image.
    image: housemate-postgres:local
    build: docker/postgres
    environment:
      # No password at all, for any role: the ports are bound to 127.0.0.1.
      # What makes this database Neon-like — roles, RLS, the pooler — does not
      # depend on how a local connection authenticates.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # From Postgres 18 the image keeps its data under
      # /var/lib/postgresql/<major>/docker: the volume mounts the parent, so a
      # future major upgrade can sit next to the old cluster.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "neondb_owner", "-d", "neondb"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgbouncer:
    image: housemate-pgbouncer:local
    build: docker/pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:56432:6432"

volumes:
  pgdata:
