name: PR preview

# Gives every PR its own preview, complete:
#   - a database: Neon branch `preview/pr-<n>`, copied from `seed` in the
#     `housemate-previews` project (never from prod: previews run unreviewed
#     code), with the PR's migrations applied;
#   - an address: https://pr-<n>.preview.house-mate.app, a Vercel domain linked
#     to the PR's Git branch, so every later push is served there with no run;
#   - the link between the two: a `DATABASE_URL` Vercel variable scoped to that
#     Git branch alone.
# Everything is removed when the PR closes. On every merge to `main`, `seed`
# receives the new migrations, so the next PR starts from an up-to-date copy.
#
# Why not the Neon <-> Vercel integration: it creates a Neon branch for every
# branch Vercel builds, PR or not, within a free quota of ten. Driving it from
# PRs means a pushed branch costs nothing until a PR is opened.
#
# By hand (GitHub down): create the Neon branch from `seed` in the console,
# add the variable and the domain in the Vercel project, and remove them after.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

# One run at a time per PR, never cancelled: a close queues behind an open,
# which finishes creating before the close deletes. Nothing is left orphaned.
concurrency:
  group: preview-${{ github.event.pull_request.number || 'seed' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_API: https://console.neon.tech/api/v2
  NEON_PROJECT: ${{ vars.NEON_PROJECT_ID }}
  NEON_DATABASE: housemate-previews
  NEON_ROLE: housemate-previews_owner
  VERCEL_API: https://api.vercel.com
  VERCEL_TEAM: ${{ vars.VERCEL_TEAM_ID }}
  VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT_ID }}
  PREVIEW_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}

jobs:
  open:
    name: Database, variable and address of the preview
    # Secrets are withheld from forks; this repository takes no fork PRs. The
    # release PR has no preview: Vercel skips its build (vercel.json), and a
    # database for it would only use up one of the ten Neon branches.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-24.04
    env:
      NEON_KEY: ${{ secrets.NEON_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Create the Neon branch from seed
        id: branch
        run: |
          set -euo pipefail
          name="preview/pr-${PR_NUMBER}"
          neon() { curl -sSf -H "Authorization: Bearer ${NEON_KEY}" -H "Content-Type: application/json" "$@"; }
          branches=$(neon "${NEON_API}/projects/${NEON_PROJECT}/branches")
          seed=$(jq -r '.branches[] | select(.name == "seed") | .id' <<<"$branches")
          id=$(jq -r --arg n "$name" '.branches[] | select(.name == $n) | .id' <<<"$branches")

          if [ -z "$seed" ]; then
            echo "::error::no seed branch in the Neon project"
            exit 1
          fi

          if [ -z "$id" ]; then
            payload=$(jq -n --arg n "$name" --arg p "$seed" '{
              branch: {name: $n, parent_id: $p},
              endpoints: [{type: "read_write",
                autoscaling_limit_min_cu: 0.25, autoscaling_limit_max_cu: 0.25}]
            }')
            id=$(neon -X POST "${NEON_API}/projects/${NEON_PROJECT}/branches" -d "$payload" | jq -r .branch.id)
            echo "Created ${name} (${id}) from seed"
          else
            echo "${name} already exists (${id})"
          fi

          # A new branch is usable once Neon reports it ready.
          for _ in $(seq 1 30); do
            state=$(neon "${NEON_API}/projects/${NEON_PROJECT}/branches/${id}" | jq -r .branch.current_state)

            if [ "$state" = "ready" ]; then
              break
            fi

            sleep 2
          done

          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"

      - name: Apply the PR's migrations
        env:
          BRANCH_ID: ${{ steps.branch.outputs.id }}
          SEED_ID: ${{ steps.branch.outputs.seed }}
        run: |
          set -euo pipefail
          neon() { curl -sSf -H "Authorization: Bearer ${NEON_KEY}" -H "Content-Type: application/json" "$@"; }
          # Direct connection: the migration lock lives in the session, which a
          # transaction-mode pool would lose (scripts/migrate.ts).
          uri=$(neon "${NEON_API}/projects/${NEON_PROJECT}/connection_uri?branch_id=${BRANCH_ID}&database_name=${NEON_DATABASE}&role_name=${NEON_ROLE}" | jq -r .uri)
          echo "::add-mask::${uri}"

          status=0
          MIGRATION_DATABASE_URL="$uri" yarn db:migrate || status=$?

          # 2 = the branch's history contradicts the PR's files (a migration
          # rewritten during review, or renumbered after a rebase). A preview
          # starts over from seed; anything else is a real failure.
          if [ "$status" = 2 ]; then
            echo "::warning::migration history diverged: resetting the preview database from seed"
            neon -X POST "${NEON_API}/projects/${NEON_PROJECT}/branches/${BRANCH_ID}/restore" \
              -d "$(jq -n --arg s "$SEED_ID" '{source_branch_id: $s}')" > /dev/null

            for _ in $(seq 1 30); do
              state=$(neon "${NEON_API}/projects/${NEON_PROJECT}/branches/${BRANCH_ID}" | jq -r .branch.current_state)

              if [ "$state" = "ready" ]; then
                break
              fi

              sleep 2
            done

            MIGRATION_DATABASE_URL="$uri" yarn db:migrate
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

      - name: Give Vercel the database of this branch only
        if: github.event.action != 'synchronize'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          BRANCH_ID: ${{ steps.branch.outputs.id }}
        run: |
          set -euo pipefail
          # The app queries through the pool; only migrations need the direct
          # connection.
          uri=$(curl -sSf -H "Authorization: Bearer ${NEON_KEY}" \
            "${NEON_API}/projects/${NEON_PROJECT}/connection_uri?branch_id=${BRANCH_ID}&database_name=${NEON_DATABASE}&role_name=${NEON_ROLE}&pooled=true" | jq -r .uri)
          echo "::add-mask::${uri}"
          payload=$(jq -n --arg v "$uri" --arg b "$HEAD_REF" '{
            key: "DATABASE_URL", value: $v, type: "sensitive",
            target: ["preview"], gitBranch: $b
          }')
          curl -sSf -o /dev/null -X POST \
            "${VERCEL_API}/v10/projects/${VERCEL_PROJECT}/env?upsert=true&teamId=${VERCEL_TEAM}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" -d "$payload"
          echo "DATABASE_URL set for branch ${HEAD_REF}"

      - name: Attach pr-<n>.preview.house-mate.app to the PR branch
        if: github.event.action != 'synchronize'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set -euo pipefail
          domain="pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' -X POST \
            "${VERCEL_API}/v10/projects/${VERCEL_PROJECT}/domains?teamId=${VERCEL_TEAM}" \
            -H "$auth" -H "Content-Type: application/json" \
            -d "$(jq -n --arg n "$domain" --arg b "$HEAD_REF" '{name: $n, gitBranch: $b}')")

          case "$code" in
            200|201)
              echo "Created ${domain} → branch ${HEAD_REF}"
              ;;
            409)
              # Already there (a reopened PR): point it at this branch.
              curl -sSf -o /dev/null -X PATCH \
                "${VERCEL_API}/v9/projects/${VERCEL_PROJECT}/domains/${domain}?teamId=${VERCEL_TEAM}" \
                -H "$auth" -H "Content-Type: application/json" \
                -d "$(jq -n --arg b "$HEAD_REF" '{gitBranch: $b}')"
              echo "${domain} re-pointed to ${HEAD_REF}"
              ;;
            *)
              echo "::error::unexpected ${code} creating ${domain}"
              cat /tmp/domain.json
              exit 1
              ;;
          esac

      - name: Rebuild the preview with its database
        if: github.event.action != 'synchronize'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          REPO_ID: ${{ github.event.repository.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Vercel fixes a deployment's variables when it builds. The build
          # Vercel started on the push predates the variable set above, so the
          # branch is built once more; later pushes find the variable in place.
          payload=$(jq -n --arg p "$VERCEL_PROJECT" --arg r "$REPO_ID" --arg b "$HEAD_REF" --arg s "$HEAD_SHA" '{
            name: "housemate", project: $p,
            gitSource: {type: "github", repoId: $r, ref: $b, sha: $s}
          }')
          url=$(curl -sSf -X POST "${VERCEL_API}/v13/deployments?teamId=${VERCEL_TEAM}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
            -d "$payload" | jq -r .url)
          echo "Rebuilding: https://${url}"
          echo "Preview: https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"

  close:
    name: Remove the preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      NEON_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Best effort throughout: something already gone is the desired state.
      - name: Detach the domain
        run: |
          set -euo pipefail
          domain="pr-${PR_NUMBER}.${PREVIEW_DOMAIN}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            "${VERCEL_API}/v9/projects/${VERCEL_PROJECT}/domains/${domain}?teamId=${VERCEL_TEAM}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "${domain}: HTTP ${code}"

      - name: Remove the branch's variable
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          ids=$(curl -sSf -H "$auth" "${VERCEL_API}/v10/projects/${VERCEL_PROJECT}/env?gitBranch=${HEAD_REF}&teamId=${VERCEL_TEAM}" \
            | jq -r --arg b "$HEAD_REF" '.envs[] | select(.gitBranch == $b) | .id')

          for id in $ids; do
            curl -sSf -o /dev/null -X DELETE -H "$auth" \
              "${VERCEL_API}/v9/projects/${VERCEL_PROJECT}/env/${id}?teamId=${VERCEL_TEAM}"
            echo "Removed variable ${id}"
          done

      - name: Delete the Neon branch
        run: |
          set -euo pipefail
          neon() { curl -sSf -H "Authorization: Bearer ${NEON_KEY}" "$@"; }
          name="preview/pr-${PR_NUMBER}"
          id=$(neon "${NEON_API}/projects/${NEON_PROJECT}/branches" \
            | jq -r --arg n "$name" '.branches[] | select(.name == $n) | .id')

          if [ -z "$id" ]; then
            echo "${name} already absent"
            exit 0
          fi

          neon -o /dev/null -X DELETE "${NEON_API}/projects/${NEON_PROJECT}/branches/${id}"
          echo "Deleted ${name} (${id})"

  seed:
    name: Bring seed up to date with main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      NEON_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Apply main's migrations to seed
        run: |
          set -euo pipefail
          neon() { curl -sSf -H "Authorization: Bearer ${NEON_KEY}" "$@"; }
          seed=$(neon "${NEON_API}/projects/${NEON_PROJECT}/branches" | jq -r '.branches[] | select(.name == "seed") | .id')
          uri=$(neon "${NEON_API}/projects/${NEON_PROJECT}/connection_uri?branch_id=${seed}&database_name=${NEON_DATABASE}&role_name=${NEON_ROLE}" | jq -r .uri)
          echo "::add-mask::${uri}"
          MIGRATION_DATABASE_URL="$uri" yarn db:migrate
