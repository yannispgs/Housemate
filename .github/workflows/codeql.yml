name: CodeQL

# Static security analysis (GitHub Code Scanning). Advanced setup — a workflow
# we own — so we can pin every action to a digest and pick a broader query
# suite. Scans both our JS/TS and the GitHub Actions workflows themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan of main so advisories published against unchanged code
    # still surface (Mondays 04:27 UTC).
    - cron: "27 4 * * 1"

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Only what CodeQL needs: read the code, upload the results.
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves (unpinned actions, script
        # injection, …); `javascript-typescript` covers the app. Neither builds.
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Broader than the default "security" pack — more security queries at
          # the cost of a few more findings to triage.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
