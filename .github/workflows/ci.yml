name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

# Independent parallel jobs: each fails on its own so it's obvious what broke,
# and they run concurrently instead of one long sequential job.
#
# The e2e job (CONVENTIONS § 11) joins this file with Playwright.
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Linting & format check
        run: yarn lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Type checking
        # Both projects: the app and the Worker (own tsconfig, Cloudflare types).
        run: yarn typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Run unit tests
        run: yarn test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Build the app
        run: yarn build

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Start the Neon-like local database
        # Local, never a hosted project: no secret involved (CONVENTIONS § 11).
        uses: ./.github/actions/local-db
      - name: Run integration tests
        run: yarn test:integration

  e2e:
    name: E2E critical (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    # The @critical journeys gate every PR, on BOTH engines, as parallel matrix
    # jobs so the second engine costs no extra wall-clock. WebKit is the
    # reference engine here: the primary use is the web app on an iPhone.
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    # Playwright's official image already carries the browsers and their system
    # libraries: installing them on a bare runner took up to 66 s for WebKit.
    # ⚠️ Its version must match `@playwright/test` exactly (1.63.0 in
    # yarn.lock): bump both together, or the browsers are not found.
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      # Default user (root): `corepack enable` writes into /usr/bin, which the
      # runner's user 1001 cannot. The user switch Playwright's guide mentions
      # is for Firefox, not used here.
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Run the critical journeys
        run: yarn playwright test --project=${{ matrix.browser }} --grep @critical
      - name: Upload the report
        # Kept on failure so a red journey can be debugged from the run page.
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-critical-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  sonar:
    name: SonarCloud issues
    # Pull requests only: the check reads the PR-scoped analysis.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    # The script waits up to 10 minutes for SonarCloud's asynchronous analysis.
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail on SonarCloud issues in the pull request
        # Stands in for the `new_violations = 0` gate condition the free plan
        # won't let us configure (see the script's header). Reads the public
        # API, so no token is involved.
        run: .github/scripts/sonar-pr-issues.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      # Secrets can't be read in a step's `if`; expose only whether it is set.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node & dependencies
        uses: ./.github/actions/setup
      - name: Start the Neon-like local database
        # Coverage merges unit and integration suites; the latter needs it.
        uses: ./.github/actions/local-db
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Codecov not set up yet
        # Codecov refuses a tokenless upload for this repository. A missing
        # token is a setup step still to do, not a defect in the PR: say so
        # instead of failing, as the Sonar job does for an unimported project.
        if: ${{ env.HAS_CODECOV_TOKEN != 'true' }}
        run: echo "::warning::CODECOV_TOKEN secret is not set — coverage measured but not uploaded."
      - name: Upload coverage to Codecov
        # Codecov computes project (total) and patch (changed lines) coverage,
        # decorates the PR, and gates per codecov.yml.
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
